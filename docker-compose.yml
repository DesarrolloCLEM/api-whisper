services:
  api-whisper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-whisper
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Recomendado para contenedor
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
      # Modelo mas liviano para evitar problemas de memoria
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_NUM_WORKERS: 1
      DATABASE_URL: sqlite:///./data/api_keys.db
    volumes:
      # Persistencia de SQLite local
      - whisper_data:/app/data
      # Cache de modelos de HuggingFace para no descargar cada arranque
      - whisper_hf_cache:/home/appuser/.cache/huggingface
    restart: unless-stopped

volumes:
  whisper_data:
  whisper_hf_cache:
